<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Handjet:wght@500;700;800&display=swap">
<style>
  :root{
    color-scheme:dark;
    --bg-page:#04070d; --felt:#072b17; --felt-sang:#0a3d21; --felt-vien:rgba(45,122,79,.42);
    --text-body:#e8f2fc; --text-muted:#93aac8; --accent:#22d3ee; --gold-amber:#fbbf24;
    --win:#4ade80; --lose:#f87171; --idle:rgba(93,114,144,.35);
    --font:"Handjet",ui-monospace,"Cascadia Mono",Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg-page);color:var(--text-body);font-family:var(--font);
    padding-inline:16px;padding-block:14px 28px}
  .trang{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

  .dau{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
  .dau h1{margin:0;font-size:28px;font-weight:800;letter-spacing:.06em}
  .dau h1 small{font-size:16px;color:var(--text-muted);letter-spacing:.1em;font-weight:700}

  .cong{display:flex;flex-wrap:wrap;gap:8px}
  .nhom{display:inline-flex;box-shadow:inset 0 0 0 1px rgba(34,211,238,.35)}
  .nhom button{font:inherit;font-size:16px;font-weight:700;letter-spacing:.08em;padding:6px 12px;
    border:0;background:transparent;color:var(--accent);cursor:pointer}
  .nhom button[aria-pressed="true"]{background:var(--accent);color:#04101c}
  .nhom button:focus-visible{outline:2px solid var(--gold-amber);outline-offset:2px}

  .ni{padding:18px 14px 22px;
    background:radial-gradient(120% 90% at 50% 0%,rgba(255,255,255,.04),transparent 60%),
      linear-gradient(178deg,color-mix(in srgb,var(--felt-sang) 50%,var(--felt)),var(--felt) 70%);
    box-shadow:inset 0 0 0 1px var(--felt-vien),inset 0 3px 10px rgba(0,0,0,.55)}
  .luoi{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 16px}
  @media (max-width:560px){.luoi{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 12px}}

  /* ══ LÁ TERMINAL (chốt bản 5) ══ */
  .cho{--khac:polygon(6px 0,calc(100% - 6px) 0,calc(100% - 6px) 3px,calc(100% - 3px) 3px,calc(100% - 3px) 6px,100% 6px,100% calc(100% - 6px),calc(100% - 3px) calc(100% - 6px),calc(100% - 3px) calc(100% - 3px),calc(100% - 6px) calc(100% - 3px),calc(100% - 6px) 100%,6px 100%,6px calc(100% - 3px),3px calc(100% - 3px),3px calc(100% - 6px),0 calc(100% - 6px),0 6px,3px 6px,3px 3px,6px 3px);
    position:relative;filter:drop-shadow(0 0 10px color-mix(in srgb,var(--ho) 22%,transparent))}
  .cho::before{content:"";position:absolute;inset:0;transform:translate(4px,5px);background:rgba(0,0,0,.6);clip-path:var(--khac)}
  .the{position:relative;display:flex;flex-direction:column;gap:6px;width:100%;aspect-ratio:5/7;
    padding:10px;clip-path:var(--khac);cursor:pointer;border:0;text-align:left;font:inherit;color:var(--text-body);
    background:linear-gradient(178deg,#0b1628 0%,#060c17 72%);
    box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ho) 75%,transparent),inset 0 0 0 2px #04070d,
      inset 0 0 22px color-mix(in srgb,var(--ho) 12%,transparent);
    transition:transform .16s steps(4,end)}
  .the:focus-visible{outline:2px solid var(--gold-amber);outline-offset:3px}
  @media (hover:hover) and (pointer:fine){.the:hover{transform:translateY(-6px)}}
  .the[aria-pressed="true"]{transform:translateY(-12px);
    box-shadow:inset 0 0 0 2px var(--ho-sang),inset 0 0 0 3px #04070d,inset 0 0 26px color-mix(in srgb,var(--ho) 26%,transparent)}

  .tren{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:14px;letter-spacing:.1em}
  .duong{color:var(--text-muted)} .duong b{color:var(--ho);font-weight:800}
  .ma{display:inline-flex;align-items:center;gap:5px;color:var(--ho-sang);font-weight:800;font-size:16px}
  .ma i{width:6px;height:6px;background:var(--ho);box-shadow:0 0 6px var(--ho)}
  .ma svg{width:22px;height:22px;display:block;filter:drop-shadow(0 0 3px color-mix(in srgb,var(--ho) 70%,transparent))}

  .cua{position:relative;flex:1 1 auto;display:flex;align-items:center;justify-content:center;overflow:hidden;
    background-color:#02050a;
    background-image:linear-gradient(color-mix(in srgb,var(--ho) 9%,transparent) 1px,transparent 1px),
      linear-gradient(90deg,color-mix(in srgb,var(--ho) 9%,transparent) 1px,transparent 1px);
    background-size:12px 12px;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ho) 30%,transparent)}
  .cua::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:3;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px)}
  .cua svg{width:88%;height:auto;aspect-ratio:1;max-height:94%;position:relative;z-index:1;
    filter:drop-shadow(0 0 3px color-mix(in srgb,var(--ho) 65%,transparent))}

  .ten{font-size:23px;font-weight:800;letter-spacing:.06em;line-height:1;color:var(--ho-sang);
    text-shadow:0 0 8px color-mix(in srgb,var(--ho) 45%,transparent);text-wrap:balance}
  @media (max-width:560px){.the .ten{font-size:19px}.the{padding:8px}.tren{font-size:13px;gap:4px;letter-spacing:.06em}.ma svg{width:18px;height:18px}.ma{gap:3px}}
  .hieu{display:flex;flex-wrap:wrap;gap:4px;font-size:14px;font-weight:700;letter-spacing:.05em}
  .hieu span{white-space:nowrap;padding:1px 5px;box-shadow:inset 0 0 0 1px var(--idle);color:var(--text-body)}
  .hieu .l b{color:var(--win)} .hieu .x b{color:var(--lose)} .hieu .v b{color:var(--gold-amber)}

  /* Họ màu = hệ thông tin: một họ một nghĩa (khớp tokens: win · lose · gold · violet). */
  .len{--ho:#4ade80;--ho-sang:#bbf7d0}
  .xuong{--ho:#f87171;--ho-sang:#fecaca}
  .hung{--ho:#a78bfa;--ho-sang:#ddd6fe}
  .hoang{--ho:#ef4444;--ho-sang:#fca5a5}
  .la{--ho:#60a5fa;--ho-sang:#bfdbfe}

  /* ══ NEON TRÊN NÉT VẼ (bản 6) — ánh sáng, nên ease-in-out; chỉ opacity + transform ══
     · .neon  = bản chép các nét MÀU CHÍNH của hình (đường xu hướng, viền chủ thể), có quầng; THỞ bằng opacity.
     · .vet   = một dải sáng trượt qua, bị cắt theo đúng các nét ấy (clipPath) ⇒ sáng chạy DỌC nét, không chạy quanh khung.
     Mỗi lá một nhịp (--vet-thoi) và lệch pha (--lech) để cả bàn không nhấp nháy đồng loạt. */
  .cua svg .neon{filter:drop-shadow(0 0 .9px var(--ho-sang));opacity:.35;animation:neonTho var(--tho-thoi,3.4s) ease-in-out infinite;animation-delay:var(--lech,0s)}
  @keyframes neonTho{0%,100%{opacity:.3}50%{opacity:1}}
  .cua svg .vet{transform:translateX(0);animation:vetQuet var(--vet-thoi,4.2s) ease-in-out infinite;animation-delay:var(--lech,0s)}
  @keyframes vetQuet{0%{transform:translateX(0)}42%{transform:translateX(var(--vet-dai,96px))}100%{transform:translateX(var(--vet-dai,96px))}}

  /* HẠ LÃI SUẤT — tái dùng LOÉ KIM LOẠI (loeKim 3,4s: quét 30%, nghỉ 70% — "thi thoảng" mới là ánh kim). */
  [data-id="ha_lai"]{--vet-thoi:3.4s}
  [data-id="ha_lai"] .cua svg .vet{animation-name:vetKim}
  @keyframes vetKim{0%{transform:translateX(0)}30%{transform:translateX(var(--vet-dai,96px))}100%{transform:translateX(var(--vet-dai,96px))}}

  /* BONG BÓNG — tái dùng skNoiLen: NỔI LÊN HẠ XUỐNG nhẹ nhàng (không rung, không nhiễu); cầu vồng chạy trên vành. */
  [data-id="bong_bong"] .cua svg{animation:noiLen 2.2s ease-in-out infinite}
  @keyframes noiLen{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

  /* ══ HOẢNG LOẠN (thiên nga đen) — lá DUY NHẤT được động CẢ LÁ ══
     · rungHien : cú rung XUẤT HIỆN, một lần (mmRungHien 420ms steps(6)) — lúc lá hiện và lúc đổi loại tin.
     · giat     : giật nhiễu lặp (mmNhieuGiat 1,9s steps(1)) trên cả lá.
     · tro      : tro bay đỏ-cam trôi lên trong cửa hình (mmTro 2,6s steps(10)).
     · quét CRT dọc (bản 5) giữ nguyên. */
  .cho.hoang{animation:giatLa 1.9s steps(1,end) infinite}
  @keyframes giatLa{0%,82%,100%{transform:translateX(0)}84%{transform:translateX(-4px)}86%{transform:translateX(3px)}88%{transform:translateX(-2px)}90%{transform:translateX(2px)}}
  .cho.hoang.rung .the{animation:rungHien 420ms steps(6,end) 1}
  @keyframes rungHien{0%,100%{transform:translate(0,0)}15%{transform:translate(-3px,1px)}35%{transform:translate(3px,-1px)}55%{transform:translate(-2px,-1px)}78%{transform:translate(2px,1px)}}
  .hoang .cua::before{content:"";position:absolute;left:0;right:0;top:0;height:18%;z-index:2;pointer-events:none;
    background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--ho) 30%,transparent) 70%,color-mix(in srgb,var(--ho-sang) 55%,transparent) 92%,transparent);
    transform:translateY(-100%);animation:quet 4.2s ease-in-out infinite}
  @keyframes quet{0%,40%{transform:translateY(-100%);opacity:0}45%{opacity:1}85%,100%{transform:translateY(560%);opacity:0}}
  .tro{position:absolute;left:14%;bottom:12%;width:2px;height:2px;z-index:2;pointer-events:none;
    box-shadow:0 0 0 0 #fbbf24,14px 6px 0 0 #f59e0b,30px -4px 0 0 #ef4444,48px 8px 0 0 #ea580c,66px 0 0 0 #fbbf24,82px 5px 0 0 #ef4444;
    opacity:0;animation:tro 2.6s steps(10,end) infinite}
  @keyframes tro{0%{transform:translateY(0);opacity:0}18%{opacity:.9}100%{transform:translateY(-58px);opacity:0}}

  @media (prefers-reduced-motion:reduce){
    .cua svg .neon{animation:none;opacity:.75}
    .cua svg .vet{animation:none;opacity:0}
    [data-id="bong_bong"] .cua svg,.cho.hoang,.cho.hoang.rung .the,.hoang .cua::before,.tro{animation:none}
    .hoang .cua::before{opacity:0}
    .tro{opacity:.5}
    .the{transition:none}
  }

  /* ══ SÁU LOẠI THIÊN NGA ĐEN — icon góc phải ══ */
  .loai{display:flex;flex-direction:column;gap:8px}
  .loai h2{margin:0;font-size:18px;letter-spacing:.1em;color:var(--text-muted);font-weight:700}
  .loai h2 b{color:#fca5a5}
  .chon{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
  @media (max-width:560px){.chon{grid-template-columns:repeat(3,minmax(0,1fr))}}
  .chon button{font:inherit;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px 6px;
    background:#070c16;border:0;color:var(--text-muted);font-size:14px;letter-spacing:.04em;cursor:pointer;
    box-shadow:inset 0 0 0 1px rgba(239,68,68,.28)}
  .chon button svg{width:34px;height:34px;display:block}
  .chon button[aria-pressed="true"]{color:#fecaca;box-shadow:inset 0 0 0 2px #ef4444,0 0 12px rgba(239,68,68,.35)}
  .chon button:focus-visible{outline:2px solid var(--gold-amber);outline-offset:2px}

  /* ══ LÁ ĐANG DÙNG — chép khuôn ô bản đồ (MarketMap) ══ */
  .cu{display:flex;flex-direction:column;background:#0a0f1c;box-shadow:3px 3px 0 rgba(10,6,24,.7);color:var(--text-muted)}
  .cu .anh{aspect-ratio:4/3;background:#1e1b3a}
  .cu .anh svg{display:block;width:100%;height:100%}
  .cu .ten2{font-size:14px;font-weight:700;padding:5px 7px 2px;letter-spacing:.02em}
  .cu .chan{font-size:12px;padding:0 7px 6px;letter-spacing:.1em}


  /* ══ 24/09 — 10 lá mới: họ màu + chip trung tính + nhãn MỚI (chỉ ở trang duyệt, ngoài khung lá) ══ */
  .ngang{--ho:#94a3b8;--ho-sang:#e2e8f0}
  .dong{--ho:#fb923c;--ho-sang:#fed7aa}
  .hieu .n b{color:#cbd5e1}
  /* TĂNG LÃI = y hệt HẠ LÃI, chỉ khác màu + linh vật ⇒ cùng nhịp loé kim loại */
  [data-id="tang_lai"]{--vet-thoi:3.4s}
  [data-id="tang_lai"] .cua svg .vet{animation-name:vetKim}
  .nhanMoi{position:absolute;z-index:4;top:-9px;left:10px;padding:2px 6px 1px;font-size:12px;font-weight:800;
    letter-spacing:.12em;line-height:1;color:#02040a;background:#e8f2fc;box-shadow:2px 2px 0 rgba(10,6,24,.7)}
</style>

<main class="trang" data-xem="moi">
  <header class="dau">
    <h1>LÁ BÀI DELPHI <small>BẢN 15 · THANH KHOẢN 5 NẤC</small></h1>
  </header>

  <div class="cong">
    <div class="nhom" role="group" aria-label="Xem bộ nào">
      <button type="button" id="xem-moi" aria-pressed="true">BẢN MỚI</button>

    <div class="chon" id="chon" role="group" aria-label="Chọn loại thiên nga đen"></div>
  </section>

</main>

  /** Lưới chữ → các <path> theo màu (gộp dải ngang, cùng ý `veDai` của app). */
  function duongTheoMau(luoi) {
    const theoMau = new Map();
    luoi.forEach((hang, y) => {
      let x = 0;
      while (x < hang.length) {
        const ch = hang[x];
        if (ch === '.' || !BANG_MAU[ch]) { x += 1; continue; }
        let r = 1;
        while (x + r < hang.length && hang[x + r] === ch) r += 1;
        if (!theoMau.has(ch)) theoMau.set(ch, []);
        theoMau.get(ch).push(`M${x},${y}h${r}v1h-${r}z`);
        x += r;
      }
    });
    return theoMau;
  }

  /** Hình lá: nền đủ màu + lớp NEON (nét chính, thở) + VỆT sáng cắt theo đúng nét chính. */
  function veHinh(t) {
    const luoi = LUOI[t.id];
    const n = luoi.length;
    const theoMau = duongTheoMau(luoi);
    const nen = [...theoMau].map(([ch, d]) => `<path fill="${BANG_MAU[ch]}" d="${d.join('')}"/>`).join('');
    const chon = [...theoMau].filter(([ch]) => t.neon.includes(ch));
    const neon = chon.map(([ch, d]) => `<path fill="${BANG_MAU[ch]}" d="${d.join('')}"/>`).join('');
    const catD = chon.map(([, d]) => d.join('')).join('');
    const id = `v-${t.id}`;
    return `<svg viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges" aria-hidden="true" style="--vet-dai:${n * 2}px">
      <defs>
        <clipPath id="c-${id}"><path d="${catD}"/></clipPath>
        <linearGradient id="g-${id}" gradientTransform="rotate(${t.goc} .5 .5)">
          <stop offset="0" stop-color="${t.vet[1]}" stop-opacity="0"/>
          <stop offset=".42" stop-color="${t.vet[1]}" stop-opacity=".55"/>
          <stop offset=".5" stop-color="${t.vet[0]}" stop-opacity="1"/>
          <stop offset=".58" stop-color="${t.vet[1]}" stop-opacity=".55"/>
          <stop offset="1" stop-color="${t.vet[1]}" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <g>${nen}</g>
      <g class="neon">${neon}</g>
      <g clip-path="url(#c-${id})"><rect class="vet" x="${-n}" y="${-n / 2}" width="${n * 0.6}" height="${n * 2}" fill="url(#g-${id})"/></g>
    </svg>`;
  }

  /** Icon nhỏ: lưới 16×16 → SVG phẳng. */
  function veIcon(luoi) {
    const n = luoi.length;
    const d = [...duongTheoMau(luoi)].map(([ch, p]) => `<path fill="${BANG_MAU[ch]}" d="${p.join('')}"/>`).join('');
    return `<svg viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges" aria-hidden="true">${d}</svg>`;
  }

  const luoiEl = document.getElementById('luoi');
  const chonEl = document.getElementById('chon');
  const tenLoai = () => LOAI.find((l) => l.id === loaiNay).ten;

  function mat(t) {
    const goc = t.id === 'thien_nga'
      ? `<span class="ma" title="${tenLoai()}"><i></i>${veIcon(ICON[loaiNay])}</span>`
      : `<span class="ma"><i></i>${t.ma}</span>`;
    const nhan = t.id === 'thien_nga' ? `${t.ten} — ${tenLoai().toLowerCase()}` : `${t.ten} — ${t.nhom.toLowerCase()}`;
    return `
      <button type="button" class="the" data-id="${t.id}" aria-pressed="false" aria-label="${nhan}">
        <span class="tren"><span class="duong"><b>${t.nhom}</b></span>${goc}</span>
        <span class="cua">${veHinh(t)}${t.id === 'thien_nga' ? '<span class="tro"></span>' : ''}</span>
        <span class="ten">${t.ten}</span>
        <span class="hieu">${t.hieu.map(([k, s, m]) => `<span class="${k}">${s} <b>${m}</b></span>`).join('')}</span>
      </button>`;
  }

  /** Cú rung xuất hiện: gỡ lớp rồi gắn lại ở khung hình sau (một lần, không lặp). */
  function rung(cho) {
    if (!cho) return;
    cho.classList.remove('rung');
    requestAnimationFrame(() => requestAnimationFrame(() => cho.classList.add('rung')));
  }

  function veMoi() {
    luoiEl.innerHTML = THE.map((t, i) =>
      `<div class="cho ${t.ho}" style="--lech:${-i * 0.7}s">${t.moi ? '<span class="nhanMoi">MỚI</span>' : ''}${mat(t)}</div>`).join('');
    luoiEl.querySelectorAll('.the').forEach((b) => b.addEventListener('click', () => {
      const bat = b.getAttribute('aria-pressed') !== 'true';
      luoiEl.querySelectorAll('.the').forEach((x) => x.setAttribute('aria-pressed', 'false'));
      b.setAttribute('aria-pressed', String(bat));
      if (b.dataset.id === 'thien_nga') rung(b.parentElement);
    }));
    rung(luoiEl.querySelector('.cho.hoang'));
  }

  function veChon() {
    chonEl.innerHTML = LOAI.map((l) =>
      `<button type="button" data-loai="${l.id}" aria-pressed="${l.id === loaiNay}">${veIcon(ICON[l.id])}<span>${l.ten}</span></button>`).join('');
    chonEl.querySelectorAll('button').forEach((b) => b.addEventListener('click', () => {
      loaiNay = b.dataset.loai;
      chonEl.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
      const cho = luoiEl.querySelector('.cho.hoang');
      if (cho) {
        const t = THE.find((x) => x.id === 'thien_nga');
        cho.innerHTML = mat(t);
        cho.querySelector('.the').addEventListener('click', () => rung(cho));
        rung(cho);
      }
    }));
  }

  function veCu() {
    luoiEl.innerHTML = THE.map((t) => `
      <div class="cu">
        <div class="anh">${ART_CU[t.cu] ?? ''}</div>
        <div class="ten2">${t.tenCu}</div>
        <div class="chan">ĐÃ QUA ✓</div>
      </div>`).join('');
  }
  function datXem(xem) {
    document.getElementById('xem-moi').setAttribute('aria-pressed', String(xem === 'moi'));
    document.getElementById('xem-cu').setAttribute('aria-pressed', String(xem === 'cu'));
    document.getElementById('loai').hidden = xem !== 'moi';
    if (xem === 'moi') veMoi(); else veCu();
  }
  document.getElementById('xem-moi').addEventListener('click', () => datXem('moi'));
  document.getElementById('xem-cu').addEventListener('click', () => datXem('cu'));
  veChon();
  datXem('moi');
})();
</script>
